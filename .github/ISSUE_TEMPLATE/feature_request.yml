name: Feature request
description: Suggest an improvement to SendAPigeon
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: surface
    attributes:
      label: Area
      options:
        - Core or file format
        - CLI
        - MCP or agents
        - Web UI or REST API
        - Documentation
        - Other
    validations:
      required: true
